[package]
name = "retro-cfw-imager"
version = "0.1.0"
description = "A friendly custom firmware SD card imager for retro handhelds"
authors = ["Corey Clark"]
edition = "2021"

[lib]
name = "retro_cfw_imager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
xz2 = "0.1"
flate2 = "1.0"
